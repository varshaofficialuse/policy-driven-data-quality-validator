[project]
name = "policy-dq"
version = "0.1.0"
description = "Policy-Driven Data Quality Validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.2",
    "fastapi>=0.135.3",
    "mcp>=1.27.0",
    "pandas>=3.0.2",
    "pydantic>=2.13.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.44.0",
]

[project.scripts]
policy-dq = "policy_dq.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.0",
]
